name: GitHub-only build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Java 21 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          validate-wrappers: true
      - name: Compile, test, generate coverage and package
        shell: bash
        run: bash ./gradlew --no-daemon clean build
      - name: Test and coverage summary
        if: always()
        shell: bash
        run: python .github/scripts/report.py
      - name: Upload plugin and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurora-economy-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            build/libs/*
            build/reports/tests/test/**
            build/reports/jacoco/test/**
            build/test-results/test/**
