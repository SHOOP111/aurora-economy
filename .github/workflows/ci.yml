name: GitHub-only build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Java 21 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Compile, test, generate coverage and package
        shell: bash
        run: bash ./gradlew --no-daemon clean build
      - name: Upload plugin and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-economy-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            build/libs/*
            build/reports/tests/test/**
            build/reports/jacoco/test/**
            build/test-results/test/**
