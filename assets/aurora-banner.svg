    <circle cx="828" cy="114" r="5" fill="#57ead3"/><circle cx="1006" cy="215" r="5" fill="#76aaff" stroke="#76aaff"/>
    <circle cx="917" cy="69" r="5" fill="#ad87f6" stroke="#ad87f6"/>
  </g>
  <text x="835" y="299" font-family="monospace" font-size="14" fill="#57ead3">Σ postings = 0</text>
  <text x="835" y="323" font-family="monospace" font-size="12" fill="#84a7bb">every currency · every commit</text>
